name: Numerical and presentation tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install solver and visualization dependencies
        run: python -m pip install numpy scipy pandas plotly
      - name: Check application startup imports
        run: cd Python_Code && python -c "from transient_visuals_v21 import phase_plot, field_plot, result_zip, offline_html, format_time, timeseries_frame, HEATMAP_PALETTES; print('Startup imports OK')"
      - name: Run transient and presentation checks
        run: cd Python_Code && python -m unittest discover -s tests -v
